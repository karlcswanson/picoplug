# openocd script: put an RP2040 into USB bootloader (BOOTSEL) mode over SWD.
#   openocd -f interface/cmsis-dap.cfg -f target/rp2040.cfg -f firmware/tools/bootsel.cfg
# Halts core 0, looks up the bootrom function reset_usb_boot ('U','B') in the
# ROM function table, and resumes execution there. The board re-enumerates
# as the RPI-RP2 mass-storage device; copy the UF2 to it.
adapter speed 5000
init
targets rp2040.core0
halt
set ft [lindex [read_memory 0x14 16 1] 0]
set p $ft
set addr 0
for {set i 0} {$i < 64} {incr i} {
    set e [read_memory $p 16 2]
    set code [lindex $e 0]
    if {$code == 0} { break }
    if {$code == 0x4255} { set addr [lindex $e 1]; break }
    set p [expr {$p + 4}]
}
if {$addr == 0} { echo "reset_usb_boot not found in ROM table"; shutdown error }
echo [format "reset_usb_boot at 0x%04x, jumping" $addr]
reg r0 0
reg r1 0
reg sp 0x20041000
reg pc $addr
resume
sleep 300
shutdown
